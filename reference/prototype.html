<title>منصة حصص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@700;800&display=swap">
<style>
:root{
  --bg:#F2F5F2;--surface:#FFFFFF;--sunk:#E8EDE9;--ink:#15201B;--muted:#56645D;--line:#D4DCD6;
  --accent:#1D5A48;--accent-ink:#FFFFFF;--accent-soft:#DAEBE3;
  --warn:#9A6208;--warn-soft:#F6E9CE;--bad:#B3261E;--bad-soft:#F9DFDB;--good:#2A7A4B;--hatch:#C6D0C9;--sl:40%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1411;--surface:#151D19;--sunk:#1C2621;--ink:#E3EAE5;--muted:#98A69F;--line:#2A3731;
    --accent:#63B89D;--accent-ink:#0B1410;--accent-soft:#1D382F;
    --warn:#E3A845;--warn-soft:#3A2D15;--bad:#F07B6F;--bad-soft:#3E201C;--good:#6DC693;--hatch:#34423B;--sl:64%;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1411;--surface:#151D19;--sunk:#1C2621;--ink:#E3EAE5;--muted:#98A69F;--line:#2A3731;
  --accent:#63B89D;--accent-ink:#0B1410;--accent-soft:#1D382F;
  --warn:#E3A845;--warn-soft:#3A2D15;--bad:#F07B6F;--bad-soft:#3E201C;--good:#6DC693;--hatch:#34423B;--sl:64%;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.6}
.app{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:grid;gap:16px}
h1,h2,h3{font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;text-wrap:balance;margin:0}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:10px;background:var(--accent);display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:7px}
.mark i{background:var(--accent-ink);border-radius:2px;opacity:.9}
.mark i:nth-child(2),.mark i:nth-child(6),.mark i:nth-child(7){opacity:.35}
.brand h1{font-size:26px;font-weight:800;line-height:1.1}
.brand p{font-size:13px;color:var(--muted)}
.proto{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:999px}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;overflow-x:auto}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text]{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;font-size:14px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fld{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.stat span{font-size:12.5px;color:var(--muted)}
.stat b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.stat b small{font-size:13px;color:var(--muted);font-weight:500}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent)}
.stat.ok b{color:var(--good)}
.stat.bad b{color:var(--bad)}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;font-size:14px}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.hint{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip.warn{border-color:var(--warn);background:var(--warn-soft)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tt{border-collapse:separate;border-spacing:4px;width:100%;min-width:940px}
table.tt th{font-size:12px;font-weight:600;color:var(--muted);padding:4px 2px}
table.tt thead th .pt{display:block;color:var(--ink);font-size:13px}
table.tt thead th .pt2{display:block;font-weight:400}
table.tt th.dh{text-align:start;padding-inline:8px;color:var(--ink);font-size:13px;white-space:nowrap;width:74px}
td.cell{height:66px;min-width:98px;border-radius:8px;padding:0;vertical-align:stretch;position:relative}
td.free{background:var(--sunk)}
td.off{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--hatch) 6px 7px);opacity:.55}
td.ext{background:repeating-linear-gradient(-45deg,var(--sunk) 0 6px,var(--hatch) 6px 8px);text-align:center;font-size:11.5px;color:var(--muted)}
td.unav{background:var(--sunk);text-align:center;font-size:11.5px;color:var(--muted);opacity:.8}
td.lunch{width:22px;padding:0}
td.lunch span{writing-mode:vertical-rl;font-size:11.5px;color:var(--muted);letter-spacing:.04em;display:block;margin:auto}
.les{height:100%;min-height:66px;border-radius:8px;padding:6px 8px;background:hsl(var(--h) 55% 50% / .13);border-inline-start:3px solid hsl(var(--h) 55% var(--sl));display:flex;flex-direction:column;gap:1px;cursor:pointer;text-align:start}
.les b{font-size:13px;font-weight:600;line-height:1.35}
.les small{font-size:11.5px;color:var(--muted);line-height:1.35}
.les em{font-style:normal;font-size:11px;color:var(--muted)}
td.sel .les{outline:2px solid var(--ink);outline-offset:-2px}
td.conf .les{outline:2px solid var(--bad);outline-offset:-2px;background:var(--bad-soft)}
td.t-move{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft);cursor:pointer}
td.t-move::after{content:"انقل هنا";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--accent)}
td.t-swap .les{outline:2px dashed var(--warn);outline-offset:-2px}
td.t-swap::after{content:"بدّل";position:absolute;top:4px;inset-inline-end:6px;font-size:11px;font-weight:700;color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline-end:5px}
.lg-free{background:var(--sunk)}
.lg-ext{background:repeating-linear-gradient(-45deg,var(--sunk) 0 3px,var(--hatch) 3px 5px)}
.lg-move{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.lg-swap{outline:2px dashed var(--warn);outline-offset:-2px}
.split{display:grid;gap:16px}
@media (min-width:920px){.split{grid-template-columns:330px 1fr;align-items:start}}
.list{display:grid;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);color:var(--ink);font:inherit;text-align:start;cursor:pointer;width:100%}
.row[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.hrow{color:var(--muted)}
.hrow.on{color:var(--ink);border-color:var(--accent)}
.step{display:inline-flex;align-items:center;gap:8px}
.step b{min-width:36px;text-align:center}
.step .btn{width:34px;padding:4px 0;font-size:16px;line-height:1.2}
.btn:disabled{opacity:.4;cursor:default}
.row .meta{font-size:12.5px;color:var(--muted)}
.kv{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums}
.log{display:grid;gap:8px;font-size:13.5px}
.brand .plat{font-size:12px;color:var(--muted);margin:0}
.brand h1{font-size:22px}
.ini{display:inline-grid;place-items:center;font-weight:800;font-family:"Noto Kufi Arabic",Tahoma,sans-serif;flex:0 0 auto}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);outline:1px solid var(--line);cursor:pointer}
.sw[aria-pressed="true"]{outline:3px solid var(--ink)}
input[type=color]{width:36px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px}
.slug span{display:inline-flex;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
.slug input{width:170px}
.schools{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.school{border-top:4px solid var(--sc)}
.school.cur{box-shadow:0 0 0 2px var(--accent)}
.appprev{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.homescreen{display:grid;justify-items:center;gap:6px;padding:22px;border-radius:22px;background:linear-gradient(160deg,#27344a,#11151c);width:150px}
.homescreen .icon{width:72px;height:72px;border-radius:17px;display:grid;place-items:center;overflow:hidden;box-shadow:0 2px 6px rgb(0 0 0/.35)}
.homescreen .icon img{width:84%;height:84%;object-fit:contain}
.homescreen .icon span{font-size:32px;font-weight:800;font-family:"Noto Kufi Arabic",Tahoma,sans-serif}
.homescreen .iname{color:#fff;font-size:11.5px;text-align:center;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
table.avg{border-collapse:separate;border-spacing:3px}
table.avg th{font-size:12px;font-weight:600;color:var(--ink);padding:2px 4px;white-space:nowrap}
table.avg th label{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
table.avg tbody th label{flex-direction:row;gap:6px}
table.avg td{width:46px;height:38px;text-align:center;border-radius:6px;background:var(--bad-soft);border:1px solid var(--line)}
table.avg td:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
table.avg td.sep,table.avg th.sep{width:8px;background:none;border:0}
table.avg td.na{background:none;border:0}
table.avg td.xt{font-size:10.5px;color:var(--warn);background:var(--warn-soft);border-color:var(--warn)}
table.avg input,table.avg th input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;margin:0}
.nt-h{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.nt-h input{width:58px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.chg{margin:6px 0 0;padding-inline-start:18px;display:grid;gap:4px;font-size:13.5px}
details summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--accent)}
.sols{border-color:var(--accent);background:var(--accent-soft)}
.sols .card{background:var(--surface)}
.adv-op{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.log div{border-inline-start:3px solid var(--line);padding-inline-start:10px}
.log time{display:block;font-size:11.5px;color:var(--muted)}
.opt{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:6px 8px;border-radius:8px;cursor:pointer}
.opt:has(input:checked){background:var(--accent-soft)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.affected{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.affected header{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
table.plain{border-collapse:collapse;width:100%;font-size:14px}
table.plain th,table.plain td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line)}
table.plain th{font-size:12.5px;color:var(--muted);font-weight:600}
table.plain tr.on td{background:var(--accent-soft)}
table.plain tr[data-act]{cursor:pointer}
.mini{border-collapse:separate;border-spacing:3px}
.mini th{font-size:11px;color:var(--muted);font-weight:600;padding:0 4px;white-space:nowrap}
.mini th.dayh{cursor:pointer;color:var(--ink);text-align:start;text-decoration:underline dotted;text-underline-offset:3px}
.mini td{min-width:70px;height:36px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;text-align:center;border:1px solid transparent}
.mini td.f{background:var(--accent-soft);color:var(--accent)}
.mini td.u{background:var(--bad-soft);color:var(--bad)}
.mini td.x{background:repeating-linear-gradient(-45deg,var(--warn-soft) 0 5px,var(--sunk) 5px 8px);color:var(--warn);border-color:var(--warn)}
.mini td.o{background:transparent;cursor:default}
.brush{display:flex;flex-wrap:wrap;gap:8px}
.brush button{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:10px;cursor:pointer}
.brush button[aria-pressed="true"]{border-color:var(--ink)}
.brush i{width:16px;height:16px;border-radius:4px;display:inline-block}
.sw-f{background:var(--accent-soft);border:1px solid var(--accent)}
.sw-u{background:var(--bad-soft);border:1px solid var(--bad)}
.sw-x{background:repeating-linear-gradient(-45deg,var(--warn-soft) 0 3px,var(--sunk) 3px 5px);border:1px solid var(--warn)}
.phone{width:min(380px,100%);margin-inline:auto;border:10px solid var(--ink);border-radius:34px;background:var(--bg);overflow:hidden}
.phone .scr{padding:18px 14px 22px;display:grid;gap:14px;min-height:620px}
.phone .hi{display:grid;gap:2px}
.phone .hi b{font-family:"Noto Kufi Arabic",Tahoma,sans-serif;font-size:18px}
.tl{display:grid;gap:6px}
.tl-it{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:stretch}
.tl-it time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:8px}
.tl-it .les{min-height:0;cursor:default}
.tl-it .les.x b{text-decoration:line-through;color:var(--muted)}
.tl-it .emp{border:1px dashed var(--line);border-radius:8px;padding:8px;font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;font-size:13.5px}
.card time{font-size:11.5px;color:var(--muted)}
.voice{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:999px;padding:6px 8px}
.voice button{width:32px;height:32px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:12px;flex:0 0 auto}
.wave{flex:1;height:18px;background:repeating-linear-gradient(90deg,var(--accent) 0 2px,transparent 2px 5px);mask:linear-gradient(90deg,#000 0 40%,rgb(0 0 0 / .45) 40%);-webkit-mask:linear-gradient(90deg,#000 0 40%,rgb(0 0 0 / .45) 40%);opacity:.7}
.voice span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.darija{font-size:13px;color:var(--muted)}
.grid2{display:grid;gap:16px}
@media (min-width:920px){.grid2{grid-template-columns:1fr 1fr;align-items:start}}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;text-align:center;z-index:10}
textarea{width:100%;min-height:160px;font:12px ui-monospace,monospace;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;direction:ltr}

[hidden]{display:none!important}
.shell{display:grid;gap:16px}
@media (min-width:980px){.shell{grid-template-columns:210px minmax(0,1fr);align-items:start}.side{position:sticky;top:12px;flex-direction:column;overflow:visible}}
.side{display:flex;gap:4px;background:var(--sunk);padding:6px;border-radius:14px;overflow-x:auto}
.side-it{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:9px 12px;border-radius:9px;cursor:pointer;text-align:start;white-space:nowrap}
.side-it:hover{color:var(--ink)}
.side-it[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08);border-inline-start:3px solid var(--accent)}
.badge{background:var(--bad);color:#fff;font-size:11.5px;border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
.work{display:grid;gap:16px;min-width:0}
.mhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.subtabs{margin-top:-4px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{position:relative;display:grid;justify-items:center;gap:6px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 10px;font:inherit;color:var(--ink);cursor:pointer}
.pcard:hover{border-color:var(--accent)}
.pcard b{font-size:14px;line-height:1.35}
.pcard .meta{font-size:12px;color:var(--muted)}
.pcard .dot{position:absolute;top:10px;inset-inline-end:10px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.av{display:inline-grid;place-items:center;flex:0 0 auto;border-radius:50%;font-weight:700;background:hsl(var(--h) 55% 88%);color:hsl(var(--h) 45% 28%)}
:root[data-theme="dark"] .av{background:hsl(var(--h) 30% 25%);color:hsl(var(--h) 60% 85%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{background:hsl(var(--h) 30% 25%);color:hsl(var(--h) 60% 85%)}}
.ccard{border-top:4px solid hsl(var(--h) 50% 50%)}
.ccard .cname{font-size:20px;font-weight:800;direction:ltr}
.gs{display:flex;gap:12px;font-size:13px;color:var(--muted)}
.lgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-items:start}
.modal{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:9;display:grid;place-items:start center;padding:24px 12px;overflow-y:auto}
.modal .sheet{background:var(--bg);border-radius:16px;padding:18px;width:100%;max-width:1000px;display:grid;gap:14px;box-shadow:0 10px 40px rgb(0 0 0/.3)}
.modal .sheet.small{max-width:620px}
.kvl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kvl span{color:var(--muted)}
.points{display:flex;gap:14px;align-items:center}
.face{font-size:44px;line-height:1}
.face.ok{color:var(--good)}.face.mid{color:var(--warn)}.face.bad{color:var(--bad)}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--ink);font-weight:600;cursor:pointer;text-align:start}

function persons(){const m={};for(const t of S.teachers){const k=t.pid||t.id;(m[k]??={id:k,rep:t,recs:[],present:false}).recs.push(t);if(t.present)m[k].present=true}return m}

const hrsOf=(t,c)=>t.hrs&&t.hrs[c]!=null?t.hrs[c]:SUB[t.s].h;
function unitsOf(){
  const U=[],miss=[];

    const t=S.teachers.find(t=>t.s===s&&t.cls.includes(c.id));

  }

}
const newOcc=()=>({c:{},t:{},r:{},sd:{},sh:{}});
const NOCAP=['cpt'];
const overCap=(o,u,d)=>!NOCAP.includes(u.s)&&(o.sh[u.c+'|'+u.s+'|'+d]||0)+u.len>2;
function put(o,u,d,p){
  for(let i=0;i<u.len;i++){const q=p+i;o.c[u.c+'|'+d+'|'+q]=u.id;o.t[u.p+'|'+d+'|'+q]=u.id}
  const k=u.c+'|'+u.s+'|'+d;o.sd[k]=(o.sd[k]||0)+1;o.sh[k]=(o.sh[k]||0)+u.len;
}
function fits(o,u,d,p,T){
  if(overCap(o,u,d))return false;
  if(T&&!T.present){const [lo,hi]=halfRange(1-halfOf(p));for(let q=lo;q<hi;q++)if(o.t[u.p+'|'+d+'|'+q])return false}
  for(let i=0;i<u.len;i++){
    const q=p+i;if(!valid(d,q))return false;
    if(o.c[u.c+'|'+d+'|'+q]||o.t[u.p+'|'+d+'|'+q])return false;
    if(blocked(T,d,q))return false;
  }
  return true;
}
function occFrom(pl,U,ign){const o=newOcc();for(const u of U){if(ign&&ign.has(u.id))continue;const x=pl[u.id];if(x)put(o,u,x.d,x.p)}return o}

/* تجميع الساعات المتتالية لنفس المادة ونفس القسم في حصة واحدة للعرض */
function rowGroups(o,UM,kind,id,d){
  const G=[],P=NP();
  for(let p=0;p<P;p++){
    const v=o[kind][id+'|'+d+'|'+p];if(!v)continue;const u=UM[v];if(!u)continue;
    const g=G[G.length-1];
    if(g&&g.p+g.ids.length===p&&halfOf(g.p)===halfOf(p)&&g.u.s===u.s&&g.u.c===u.c&&g.u.t===u.t)g.ids.push(v);
    else G.push({p,d,u,ids:[v]});
  }
  return G;
}

/* ---------- محرك البحث: تلدين محاكى مع تقييم تزايدي ---------- */
const W={un:10000,lone:400,cgap:6,nadj:20,sing:3,tgap:250,pgap:1,th1:40,split:300,half1:2,hard:1,last:.5,over:3};
function engine(U,init,opt={}){
  const D=6,P=NP(),AD=activeDays(),amN=S.cfg.amN,hf=p=>p<amN?0:1;
  const cI={},tI={},sI={},skeys=Object.keys(SUB);
  const PM=persons(),PL=Object.values(PM);S.classes.forEach((c,i)=>cI[c.id]=i);PL.forEach((x,i)=>tI[x.id]=i);skeys.forEach((s,i)=>sI[s]=i);
  const C=S.classes.length,T=PL.length,SN=skeys.length,N=U.length;
  const uc=new Int16Array(N),ut=new Int16Array(N),us=new Int16Array(N),lk=new Uint8Array(N);
  const nocap=skeys.map(s=>NOCAP.includes(s)),hard=skeys.map(s=>!!SUB[s].hard),dbl=skeys.map(s=>!!SUB[s].dbl);
  const pres=PL.map(x=>x.present),locked=new Set(S.locked),blk=(S.cfg.block??2)>=2,wmv=opt.mv||0;
  U.forEach((u,i)=>{uc[i]=cI[u.c];ut[i]=tI[u.p];us[i]=sI[u.s];lk[i]=locked.has(u.c)&&init[u.id]?1:0});
  const av=new Uint8Array(T*D*P);
  PL.forEach((x,ti)=>{for(let d=0;d<D;d++)for(let p=0;p<P;p++)av[(ti*D+d)*P+p]=valid(d,p)&&x.recs.every(t=>!blocked(t,d,p))?1:0});
  const TH=new Uint8Array(T*D*2),Gc=new Int16Array(C*D*P).fill(-1),Gt=new Int16Array(T*D*P).fill(-1),SC=new Uint8Array(C*SN*D),need=new Uint8Array(C*SN);
  const pd=new Int8Array(N).fill(-1),pp=new Int8Array(N).fill(-1),od=new Int8Array(N).fill(-1),op=new Int8Array(N).fill(-1);
  for(let i=0;i<N;i++)need[uc[i]*SN+us[i]]++;
  const lastP=d=>(S.cfg.days[d]==='am'?amN:P)-1,capD=Math.max(5,P-2);
  const CD=new Float64Array(C*D),TD=new Float64Array(T*D),CS=new Float64Array(C*SN);
  let total=0;
  const ok=(i,d,p)=>d>=0&&p>=0&&p<P&&av[(ut[i]*D+d)*P+p]&&(pres[ut[i]]||!TH[(ut[i]*D+d)*2+1-hf(p)])&&Gc[(uc[i]*D+d)*P+p]<0&&Gt[(ut[i]*D+d)*P+p]<0&&(nocap[us[i]]||SC[(uc[i]*SN+us[i])*D+d]<2);
  const set=(i,d,p)=>{pd[i]=d;pp[i]=p;TH[(ut[i]*D+d)*2+hf(p)]++;Gc[(uc[i]*D+d)*P+p]=i;Gt[(ut[i]*D+d)*P+p]=i;SC[(uc[i]*SN+us[i])*D+d]++};
  const unset=i=>{const d=pd[i],p=pp[i];if(d<0)return;TH[(ut[i]*D+d)*2+hf(p)]--;Gc[(uc[i]*D+d)*P+p]=-1;Gt[(ut[i]*D+d)*P+p]=-1;SC[(uc[i]*SN+us[i])*D+d]--;pd[i]=-1;pp[i]=-1};
  function cDay(c,d){
    let sc=0,tot=0;const b=(c*D+d)*P;
    for(const [lo,hi] of [[0,amN],[amN,P]]){let f=-1,l=-1,n=0;for(let p=lo;p<hi;p++)if(Gc[b+p]>=0){n++;if(f<0)f=p;l=p}
      if(n){sc+=(l-f+1-n)*W.cgap;if(n===1)sc+=W.half1}tot+=n}

const clsById=id=>S.classes.find(c=>c.id===id);
function teachesCls(t){return t.cls.filter(c=>{const k=clsById(c);return k&&clsSubj(k).includes(t.s)})}
function forcedLoneH(t,over={}){
  let H=0,M=0;for(const r of [t,...siblings(t)])for(const c of teachesCls(r)){const h=r===t&&over[c]!=null?over[c]:hrsOf(r,c);if(h<=0)continue;H+=h;M+=NOCAP.includes(r.s)?h:Math.min(2,h)}
  for(let k=1;k<=activeDays().length;k++)if(2*k<=H&&H<=k*M)return false;return H>0;
}
function addHour(t,c,slot){const h=hrsOf(t,c);t.hrs??={};t.hrs[c]=h+1;if(slot)S.place[c+'_'+t.s+'_h'+h]={d:slot.d,p:slot.p}}
function removeHour(t,c,slot){
  const s=t.s,h=hrsOf(t,c);if(h<=1)return;
  const ids=[...Array(h).keys()].map(j=>c+'_'+s+'_h'+j);
  let drop=slot?ids.find(id=>S.place[id]&&S.place[id].d===slot.d&&S.place[id].p===slot.p):null;
  if(!drop)drop=ids.find(id=>!S.place[id])||ids[h-1];
  const keep=ids.filter(id=>id!==drop).map(id=>S.place[id]);ids.forEach(id=>delete S.place[id]);
  keep.forEach((x,j)=>{if(x)S.place[c+'_'+s+'_h'+j]=x});t.hrs??={};t.hrs[c]=h-1;
}
function effTags(m0,m){
  const r=[],dd=(a,b,n)=>{if(b>a)r.push(`<span class="tag">+${b-a} ${n}</span>`);else if(b<a)r.push(`<span class="tag acc">−${a-b} ${n}</span>`)};
  dd(m0.unplaced,m.unplaced,'حصة بدون مكان');dd(m0.gaps,m.gaps,'فراغ للأقسام');dd(m0.lone,m.lone,'يوم بساعة واحدة');dd(m0.split||0,m.split||0,'يوم صباحا ومساء');dd(m0.tgaps,m.tgaps,'فراغ للأساتذة');dd(m0.dups,m.dups,'ساعة مفصولة');
  return r;
}
function advise(){
  const {U}=unitsOf(),TM=tmap(),UM={},o=buildOcc(U),m0=metrics(S.place,U),cap=capOf(S.cfg),P=NP(),AD=activeDays(),out=[];
  for(const u of U)UM[u.id]=u;
  const tOf=(c,s)=>S.teachers.find(t=>t.s===s&&t.cls.includes(c));
  const clsTotal=c=>U.filter(u=>u.c===c).length;
  const tDayN=(tid,d)=>tHours(o,pk(tid),d);
  const hChange=(t,dv)=>`${esc(t.n)}: ${hoursOf(t)} ← ${hoursOf(t)+dv} ساعة في الأسبوع`;
  // يقيّم إضافة ساعة في خانة محددة
  const fillOpts=(c,d,p)=>{
    const r=[];
    for(const s of clsSubj(clsById(c))){const t=tOf(c,s);if(!t)continue;
      if(blocked(t,d,p)||o.t[(t.pid||t.id)+'|'+d+'|'+p]||o.c[c+'|'+d+'|'+p])continue;
      if(!NOCAP.includes(s)&&(o.sh[c+'|'+s+'|'+d]||0)>=2)continue;
      if(hrsOf(t,c)>=8||clsTotal(c)+1>cap)continue;
      const nid=c+'_'+s+'_h'+hrsOf(t,c),U2=[...U,{id:nid,c,s,t:t.id,p:t.pid||t.id,len:1,room:null}],m=metrics({...S.place,[nid]:{d,p}},U2);
      if(m.lone>m0.lone||m.tgaps>m0.tgaps||(m.split||0)>(m0.split||0))continue;
      const pair=[p-1,p+1].some(q=>q>=0&&q<P&&halfOf(q)===halfOf(p)&&(()=>{const v=o.c[c+'|'+d+'|'+q];return v&&UM[v].s===s})());
      r.push({sc:(m.gaps-m0.gaps)*3+(m.lone-m0.lone)*10+(m.dups-m0.dups)*2-(pair?2:0)-(tDayN(t.id,d)?1:0),
        label:`إضافة ساعة ${SUB[s].sh} مع ${esc(t.n)} في ${DAYS[d]} ${tl(p)} (${hrsOf(t,c)} ← ${hrsOf(t,c)+1} س في هذا القسم)`,
        eff:[...effTags(m0,m),`<span class="tag">${hChange(t,1)}</span>`],run:()=>{addHour(t,c,{d,p});return 'أُضيفت الساعة في مكانها'}});
    }
    return r.sort((a,b)=>a.sc-b.sc).slice(0,2);
  };
  const moveOpt=(ids,targets)=>{
    let best=null;
    for(const tg of targets){const mv=Array.isArray(tg[0])?tg.map(([id,d,p])=>({id,d,p})):[{id:tg[0],d:tg[1],p:tg[2]}];
      const np=applyMoves(S.place,U,UM,mv,TM);if(!np)continue;const m=metrics(np,U);
      const sc=(m.gaps-m0.gaps)*3+(m.lone-m0.lone)*10+((m.split||0)-(m0.split||0))*8+(m.tgaps-m0.tgaps)*6+(m.dups-m0.dups)*2+(m.unplaced-m0.unplaced)*50+mv.length*.1;if(sc>=0)continue;
      if(!best||sc<best.sc)best={sc,label:mv.map(({id,d,p})=>{const u=UM[id],y=S.place[id];return `نقل ${SUB[u.s].sh} (${esc(clsName(u.c))} · ${esc(TM[u.t].n)}) من ${DAYS[y.d]} ${tl(y.p)} إلى ${DAYS[d]} ${tl(p)}`}).join('، و'),eff:effTags(m0,m),run:()=>{commitPlace(np);return 'نُقلت الحصة'}}}
    return best?[best]:[];
  };
  const removeOpt=(id,why)=>{const u=UM[id],t=TM[u.t],h=hrsOf(t,u.c);if(h<=1)return [];
    const pl={...S.place};delete pl[id];const U2=U.filter(z=>z.id!==id),m=metrics(pl,U2);if(m.lone>m0.lone)return [];
    const y=S.place[id];
    return [{label:`نقص ساعة ${SUB[u.s].sh} (${h} ← ${h-1} س في هذا القسم)${y?` وحذف حصة ${DAYS[y.d]} ${tl(y.p)}`:''}`,eff:[...effTags(m0,m),`<span class="tag">${hChange(t,-1)}</span>`,why?`<span class="tag">${why}</span>`:''],run:()=>{removeHour(t,u.c,y);return 'نقصت ساعة'}}]};

  // 1) حصص بدون مكان
  const unpl=U.filter(u=>!S.place[u.id]);
  if(unpl.length){
    const opts=[];

      const subs=clsSubj(c).map(s=>({s,t:tOf(c.id,s)})).filter(x=>x.t&&hrsOf(x.t,c.id)>=3).sort((a,b)=>hrsOf(b.t,c.id)-hrsOf(a.t,c.id)).slice(0,3);
      for(const x of subs){const h=hrsOf(x.t,c.id);opts.push({label:`${esc(c.n)}: نقص ساعة ${SUB[x.s].sh} (${h} ← ${h-1} س)`,eff:[`<span class="tag">${n} ← ${n-1} حصة للقسم، والخانات ${cap}</span>`],run:()=>{removeHour(x.t,c.id);return 'نقصت ساعة'},regen:true})}
      opts.push({label:`زيادة حصص في توقيت المدرسة (الخانات الآن ${cap})`,eff:[],goto:'cfg'});
    }
    for(const X of Object.values(persons())){const t=X.rep,{need,mx}=tMax(X,U),f=Math.min(freeOf(t),mx);if(need<=f)continue;
      if(!X.present)opts.push({label:`اعتبار ${esc(t.n)} متواجدا في المدرسة (يمكن أن يأتي صباحا ومساء)`,eff:[`<span class="tag">الحد الأقصى يصبح ${tMax({...X,present:true},U).mx} ساعة</span>`],run:()=>{t.present=true;syncPerson(t);return 'صار الأستاذ متواجدا'},regen:true});
      for(const c of teachesCls(t).filter(c=>hrsOf(t,c)>=2).slice(0,3)){const h=hrsOf(t,c);opts.push({label:`${esc(t.n)}: نقص ساعة مع ${esc(clsName(c))} (${h} ← ${h-1} س)`,eff:[`<span class="tag">${need} ساعة مطلوبة و${f} متاحة</span>`],run:()=>{removeHour(t,c);return 'نقصت ساعة'},regen:true})}
      opts.push({label:`توسيع أوقات فراغ ${esc(t.n)}`,eff:[],goto:'data',tid:t.id});
    }
    if(!opts.length){opts.push({label:'بحث أعمق (حوالي 20 ثانية) لإيجاد مكان لكل الحصص',eff:[],fix:true,deep:true})}
    out.push({title:`${unpl.length} حصص بدون مكان`,detail:unpl.slice(0,6).map(u=>esc(clsName(u.c))+' · '+SUB[u.s].sh).join('، '),opts});

  for(const x of Object.values(persons())){const t=x.rep;if(x.present||!forcedLoneH(t))continue;const opts=[];

      if(h<8&&clsTotal(c)+1<=cap&&!forcedLoneH(t,{[c]:h+1}))opts.push({label:`زيادة ساعة ${SUB[t.s].sh} مع ${esc(clsName(c))} (${h} ← ${h+1} س)`,eff:[`<span class="tag acc">يصبح تفادي الساعة الواحدة ممكنا</span>`,`<span class="tag">${hChange(t,1)}</span>`],run:()=>{addHour(t,c);return 'زادت ساعة'},regen:true});
      if(h>1&&!forcedLoneH(t,{[c]:h-1}))opts.push({label:`نقص ساعة ${SUB[t.s].sh} مع ${esc(clsName(c))} (${h} ← ${h-1} س)`,eff:[`<span class="tag acc">يصبح تفادي الساعة الواحدة ممكنا</span>`,`<span class="tag">${hChange(t,-1)}</span>`],run:()=>{removeHour(t,c);return 'نقصت ساعة'},regen:true});
    }
    opts.push({label:`اعتبار ${esc(t.n)} متواجدا في المدرسة (تُقبل الساعة الواحدة)`,eff:[],run:()=>{t.present=true;syncPerson(t);return 'صار الأستاذ متواجدا'}});
    out.push({title:`${esc(t.n)} يُضطر ليوم بساعة واحدة`,detail:`${hoursOf(t)} ساعات في الأسبوع لا يمكن توزيعها على أيام من ساعتين على الأقل، لأن المادة لا تتجاوز ساعتين في اليوم مع نفس القسم.`,opts});
  }
  // 3) فراغات بين حصص القسم، و4) فترة بساعة واحدة للقسم
  for(const c of S.classes)for(const d of AD)for(const h of [0,1]){
    const [lo,hi]=halfRange(h),ps=[];for(let p=lo;p<hi;p++)if(o.c[c.id+'|'+d+'|'+p])ps.push(p);
    if(!ps.length)continue;const f=ps[0],l=ps[ps.length-1];

      const opts=[...fillOpts(c.id,d,p),...moveOpt(edge,edge.map(id=>[id,d,p])),...(ps.length===2||l-f===ps.length?[]:[]),
        ...(edge.flatMap(id=>{const before=ps.filter(q=>q<p).length,after=ps.filter(q=>q>p).length;const y=S.place[id];return (y.p===l&&after===1)||(y.p===f&&before===1)?removeOpt(id,'تُغلق الفراغ'):[]}))];

        const nb=[q-1,q+1].some(z=>z>=0&&z<P&&halfOf(z)===halfOf(q)&&o.c[c.id+'|'+d2+'|'+z]);if(nb)targets.push([id,d2,q])}

    }
  }

  for(const X of Object.values(persons()))if(!X.present)for(const d of AD)for(const h of [0,1]){const t=X.rep;

      const mine=U.filter(u=>u.p===X.id&&S.place[u.id]);

        const w=o.c[v.c+'|'+d+'|'+p];if(!w)T.push([v.id,d,p]);else if(w!==v.id)T.push([[v.id,d,p],[w,y.d,y.p]])}

    const am=[],pm=[];for(let p=0;p<P;p++)if(o.t[X.id+'|'+d+'|'+p])(halfOf(p)?pm:am).push(p);
    if(!am.length||!pm.length)continue;

    for(const q0 of few){const id=o.t[X.id+'|'+d+'|'+q0],u=UM[id];
      for(const q of many)for(const p of [q-1,q+1]){if(p<0||p>=P||halfOf(p)!==halfOf(q)||o.t[X.id+'|'+d+'|'+p])continue;const w=o.c[u.c+'|'+d+'|'+p];
        if(!w)T.push([id,d,p]);else T.push([[id,d,p],[w,d,q0]])}}
    const opts=few.length===1?moveOpt([],T):[];
    out.push({title:`${esc(X.rep.n)}: يأتي صباحا ومساء · ${DAYS[d]}`,detail:`${am.length} ساعات صباحا و${pm.length} مساء. الأفضل جمعها في فترة واحدة.`,opts:[...opts,{label:'البحث عن حلول تلقائية لكل الجدول',eff:[],fix:true}]});
  }}

      for(const q of [y.p-1,y.p+1]){if(q<0||q>=P||halfOf(q)!==halfOf(y.p))continue;const w=o.c[c+'|'+d+'|'+q];
        if(!w)T.push([mover,d,q]);else if(w!==mover){T.push([[mover,d,q],[w,x.d,x.p]]);

          if(j&&j!==mover&&UM[j].c!==c){const w2=o.c[UM[j].c+'|'+d+'|'+x.p];const mv=[[mover,d,q],[w,x.d,x.p],[j,d,x.p]];if(w2&&w2!==w)mv.push([w2,d,q]);T.push(mv)}}}}
    const opts=moveOpt(ids,T);
    if(opts.length)out.push({title:`${SUB[s].sh} مفصولة في ${esc(clsName(c))} · ${DAYS[d]}`,detail:`ساعتا المادة في ${tl(a.p)} و${tl(b.p)}، ويمكن جعلهما متتاليتين.`,opts});

function slotMap(pl,U){const m={};for(const u of U){const x=pl[u.id];if(x)(m[u.c+'|'+u.s]??=[]).push(x.d*100+x.p)}for(const k in m)m[k].sort((a,b)=>a-b);return m}
function diffPlans(pl0,U0,pl1,U1){
  const A=slotMap(pl0,U0),B=slotMap(pl1,U1),out=[];
  const need0={},need1={};for(const u of U0)need0[u.c+'|'+u.s]=(need0[u.c+'|'+u.s]||0)+1;for(const u of U1)need1[u.c+'|'+u.s]=(need1[u.c+'|'+u.s]||0)+1;
  for(const k of new Set([...Object.keys(A),...Object.keys(B),...Object.keys(need1)])){
    const b=[...(B[k]||[])],rm=(A[k]||[]).filter(x=>{const i=b.indexOf(x);if(i>=0){b.splice(i,1);return false}return true});
    const [c,s]=k.split('|'),dn=(need1[k]||0)-(need0[k]||0);
    const moves=Math.min(rm.length,b.length);
    for(let i=0;i<moves;i++)out.push({c,s,from:rm[i],to:b[i]});
    for(let i=moves;i<b.length;i++)out.push({c,s,from:null,to:b[i],add:dn>0});
    for(let i=moves;i<rm.length;i++)out.push({c,s,from:rm[i],to:null,del:dn<0});
  }
  return out;
}
function chLine(x,TM){
  const t=S.teachers.find(t=>t.s===x.s&&t.cls.includes(x.c)),who=`${SUB[x.s].sh} · ${esc(clsName(x.c))}${t?' · '+esc(t.n):''}`,at=v=>`${DAYS[Math.floor(v/100)]} ${tl(v%100)}`;
  if(x.from!=null&&x.to!=null)return `<li><b>${who}</b>: من ${at(x.from)} إلى ${at(x.to)}</li>`;
  if(x.to!=null)return `<li><b>${who}</b>: ${x.add?'ساعة جديدة':'وُضعت'} في ${at(x.to)}</li>`;
  return `<li><b>${who}</b>: ${x.del?'حُذفت ساعة':'بقيت بدون مكان'} من ${at(x.from)}</li>`;
}
function buildSolutions(title,mutate,deep){
  const snap=JSON.stringify(S),{U:U0}=unitsOf(),pl0={...S.place},m0=metrics(pl0,U0);
  if(mutate)mutate();
  const after=JSON.stringify(S),{U}=unitsOf(),list=[],seen=new Set();
  for(const [name,desc,mv,T0,ms] of [['أقل تغيير','ينقل أقل عدد من الحصص',12,3,1000],['متوازن','توازن بين الجودة وعدد التغييرات',4,6,1200],['أفضل جودة','أفضل جدول ممكن ولو تغيرت حصص أكثر',1,15,1600]]){
    let best=null;for(let r=0;r<2;r++){const E=engine(U,S.place,{mv});E.greedy();E.anneal((deep?ms*4:ms)/2,deep?T0*2:T0,.1);if(!best||E.score()<best.sc)best={sc:E.score(),pl:E.out()}}
    const ch=diffPlans(pl0,U0,best.pl,U),m=metrics(best.pl,U),sig=JSON.stringify(ch);
    if(seen.has(sig))continue;seen.add(sig);
    const pure=engine(U,best.pl).score();if(list.length&&pure>=list[list.length-1].sc-1e-6)continue;best.sc=pure;
    if(!mutate&&!ch.length)continue;
    list.push({name,desc,pl:best.pl,m,ch,q:quality(m,0),sc:best.sc});
  }

}

function dayLoad(tid,d,o){const k=pk(tid);let n=0;for(let p=0;p<NP();p++)if(o.t[k+'|'+d+'|'+p])n++;return n}
function analyze(tid,d){
  const {U}=unitsOf(),UM={};for(const u of U)UM[u.id]=u;
  const o=buildOcc(U),TM=tmap(),absent=new Set(S.absences.filter(a=>a.d===d).map(a=>pk(a.tid)));absent.add(pk(tid));
  const freeT=(t,p,len)=>{const k=t.pid||t.id;if(absent.has(k))return false;for(let i=0;i<len;i++){const q=p+i;if(o.t[k+'|'+d+'|'+q]||blocked(t,d,q))return false;if(S.subs.some(s=>s.d===d&&s.sub===t.id&&q>=s.p&&q<s.p+s.len))return false}return true};
  return rowGroups(o,UM,'t',pk(tid),d).map(g=>{
    const u={...g.u,len:g.ids.length},p=g.p,opts=[];
    for(const t of S.teachers)if(t.id!==tid&&t.s===u.s&&freeT(t,p,u.len))opts.push({type:'same',t:t.id});
    S.teachers.filter(t=>t.id!==tid&&t.s!==u.s&&freeT(t,p,u.len)).map(t=>({t,n:dayLoad(t.id,d,o)})).filter(z=>z.n>0).sort((a,b)=>b.n-a.n).slice(0,2).forEach(z=>opts.push({type:'review',t:z.t.id}));
    if(u.len===1){const end=halfRange(halfOf(p))[1];for(let q=p+1;q<end;q++){const v=o.c[u.c+'|'+d+'|'+q];if(!v)continue;const vu=UM[v];if(vu.p===pk(tid))continue;if(freeT(TM[vu.t],p,1)){opts.push({type:'swap',v,q});break}}}
    opts.push({type:'cancel'});
    return {u,ids:g.ids,p,opts,choice:0};
  });
}

}

const FN_B=['ياسين','آدم','يوسف','زكرياء','أنس','إلياس','حمزة','عمر','أيوب','مهدي','ريان','إسماعيل','سفيان','بلال','نزار','وليد','سامي','زياد','إدريس','طه'];

const LN=['العلوي','بنعلي','الإدريسي','التازي','الفاسي','المرابط','الحسني','القاسمي','بوزيد','الشرقاوي','السعيدي','الوزاني','بنموسى','الكتاني','أمزيان','الرحماني','الصقلي','الزياني','بلحاج','العمراني','الناصري','بنجلون','الشامي','الغزاوي'];
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

const dayIdx=s=>{const g=new Date(s+'T12:00').getDay();return g===0?-1:g-1};
const hueOf=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))%360;return h};
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>[...w][0]).join('\u200c');
const avatar=(n,g,size=56)=>`<span class="av" style="width:${size}px;height:${size}px;font-size:${size*.36}px;--h:${g==='f'?330:g==='m'?210:hueOf(n)}">${esc(initials(n))}</span>`;
function seedStudents(){
  let r=7;const rnd=()=>{r=(r*16807)%2147483647;return r/2147483647};const pick=a=>a[Math.floor(rnd()*a.length)];
  S.students=[];S.parents=[];S.att=[];S.incidents=[];S.meetings=[];S.msgs=[];S.docs=[];S.rules={absAlert:4,late:15};
  let mat=100;const yy=String(new Date().getFullYear()).slice(2);
  for(const c of S.classes){const n=12+Math.floor(rnd()*6);
    const seen=new Set();for(let i=0;i<n;i++){const g=rnd()<.5?'m':'f';let ln=pick(LN),fn=pick(g==='m'?FN_B:FN_G);while(seen.has(fn+ln)){ln=pick(LN);fn=pick(g==='m'?FN_B:FN_G)}seen.add(fn+ln);
      let par=S.parents.find(p=>p.ln===ln&&rnd()<.35);
      if(!par){const fa=rnd()<.6;par={id:'p'+uid(),ln,name:(fa?'السيد ':'السيدة ')+pick(fa?FN_B:FN_G)+' '+ln,phone:'06'+String(Math.floor(rnd()*1e8)).padStart(8,'0'),rel:fa?'الأب':'الأم'};S.parents.push(par)}
      S.students.push({id:'e'+uid(),fn,ln,g,cls:c.id,mat:`${++mat}/${yy}`,birth:`20${10+Math.floor(rnd()*6)}-0${1+Math.floor(rnd()*9)}-1${Math.floor(rnd()*9)}`,pid:par.id,status:'active',health:rnd()<.06?'حساسية':'',photoOk:rnd()>.05,since:rnd()<.2?'جديد':'قديم'})}}
  // سجل غياب تجريبي على الأسبوعين الماضيين
  const now=new Date();for(let k=1;k<=12;k++){const d=new Date(now);d.setDate(now.getDate()-k);if(d.getDay()===0)continue;const iso=d.toISOString().slice(0,10);
    for(let j=0;j<4;j++){const s=S.students[Math.floor(rnd()*S.students.length)];const late=rnd()<.35;
      S.att.push({id:'a'+uid(),sid:s.id,date:iso,p:Math.floor(rnd()*4),type:late?'late':'absent',mins:late?5+Math.floor(rnd()*30):0,just:rnd()<.5,reason:rnd()<.5?'مرض':'',msg:'sent',com:''})}}
  for(let k=0;k<3;k++){const s=S.students[Math.floor(rnd()*S.students.length)];S.att.push({id:'a'+uid(),sid:s.id,date:todayISO(),p:0,type:'absent',mins:0,just:false,reason:'',msg:'sent',com:''})}
  const s0=S.students[3];if(s0)for(let k=2;k<7;k++){const d=new Date(now);d.setDate(now.getDate()-k);if(d.getDay())S.att.push({id:'a'+uid(),sid:s0.id,date:d.toISOString().slice(0,10),p:1,type:'absent',mins:0,just:false,reason:'',msg:'sent',com:''})}
  const s1=S.students[9];if(s1)S.incidents.push({id:'i'+uid(),sid:s1.id,date:todayISO(),time:'10:15',title:'استعمال الهاتف أثناء الحصة',type:'neg',grav:'light',measure:'تنبيه شفوي',pub:true,desc:'استعمل الهاتف أثناء حصة الرياضيات.',by:'الحراسة العامة'});
}

function listData(k){
  const act=S.students.filter(s=>s.status==='active'),P=Object.fromEntries(S.parents.map(p=>[p.id,p]));
  const row=s=>[stuName(s),clsName(s.cls),s.mat,s.g==='f'?'أنثى':'ذكر',(P[s.pid]||{}).name||'',(P[s.pid]||{}).phone||''];
  const H=['الاسم','القسم','رقم التسجيل','الجنس','الولي','الهاتف'];
  if(k==='all')return {H,R:act.map(row)};
  if(k==='bycls')return {H,R:S.classes.flatMap(c=>act.filter(s=>s.cls===c.id).map(row))};
  if(k==='family')return {H:['الولي','الهاتف','الأبناء','العدد'],R:S.parents.map(p=>{const ch=act.filter(s=>s.pid===p.id);return [p.name,p.phone,ch.map(s=>s.fn+' ('+clsName(s.cls)+')').join('، '),ch.length]}).filter(r=>r[3]>1)};
  if(k==='nophoto')return {H,R:act.filter(s=>!s.photoOk).map(row)};
  if(k==='eff')return {H:['القسم','ذكور','إناث','المجموع'],R:[...S.classes.map(c=>{const L=act.filter(s=>s.cls===c.id);return [c.n,L.filter(s=>s.g==='m').length,L.filter(s=>s.g==='f').length,L.length]}),['المجموع',act.filter(s=>s.g==='m').length,act.filter(s=>s.g==='f').length,act.length]]};
  if(k==='new')return {H,R:act.filter(s=>s.since==='جديد').map(row)};
  if(k==='health')return {H:[...H,'ملاحظة'],R:act.filter(s=>s.health).map(s=>[...row(s),s.health])};
  if(k==='absrate')return {H:['القسم','التلاميذ','الغيابات','غير مبررة','التأخرات'],R:S.classes.map(c=>{const ids=new Set(act.filter(s=>s.cls===c.id).map(s=>s.id)),A=S.att.filter(a=>ids.has(a.sid));return [c.n,ids.size,A.filter(a=>a.type==='absent').length,A.filter(a=>a.type==='absent'&&!a.just).length,A.filter(a=>a.type==='late').length]})};
  if(k==='disc')return {H:['التاريخ','التلميذ','القسم','الحادثة','الإجراء'],R:S.incidents.map(i=>{const s=S.students.find(x=>x.id===i.sid);return [i.date,stuName(s),clsName(s?s.cls:''),i.title,i.measure||'']})};
  return {H:[],R:[]};
}

  else if(id==='cfg-blk'){UI.cfg.block=+el.value;render()}
  else if(id==='cfg-ams'){UI.cfg.amStart=el.value;render()}
  else if(id==='cfg-pms'){UI.cfg.pmStart=el.value;render()}
  else if(id==='abs-t'){UI.absT=el.value;UI.absRows=null;render()}
  else if(id==='abs-d'){UI.absD=+el.value;UI.absRows=null;render()}
  else if(id==='abs-r'){UI.absR=el.value}
  else if(el.name&&el.name.startsWith('ao')){UI.absRows[+el.dataset.i].choice=+el.dataset.j;render()}
  else if(id==='ed-n'){const t=TM[UI.dataT];t.n=el.value.trim()||t.n;syncPerson(t);save();render()}
  else if(id==='ed-s'){const t=TM[UI.dataT];t.s=el.value;t.hrs={};for(const c of t.cls)for(const x of S.teachers)if(x.id!==t.id&&x.s===t.s)x.cls=x.cls.filter(z=>z!==c);markDirty();render()}
  else if(id==='ed-pr'){const t=TM[UI.dataT];t.present=el.checked;syncPerson(t);markDirty();render()}
  else if(id==='ed-sh'){const t=TM[UI.dataT];t.shared=el.checked;if(!t.shared)t.ext=[];syncPerson(t);markDirty();render()}
  else if(id==='add-s'){UI.add.s=el.value}
  else if(id==='addc-from'){UI.addC.from=el.value}
  else if(id==='br-name'){const m=meta();m.name=el.value.trim()||m.name;S.school=m.name;save();render()}
  else if(id==='br-slug'){const m=meta();m.slug=slugify(el.value||m.name,m.id);save();render()}
  else if(id==='br-colorx'){meta().color=el.value;applyBrand();save();render()}
  else if(id==='br-logo'&&el.files&&el.files[0]){readLogo(el.files[0]).then(u=>{meta().logo=u;save();render()}).catch(()=>toast('تعذّرت قراءة الصورة'))}
  else if(id==='ns-colorx'){readBrandFields('ns',UI.newS);UI.newS.color=el.value;render()}
  else if(id==='ns-logo'&&el.files&&el.files[0]){readBrandFields('ns',UI.newS);readLogo(el.files[0]).then(u=>{UI.newS.logo=u;render()}).catch(()=>toast('تعذّرت قراءة الصورة'))}
  else if(id==='ns-name'){UI.newS.name=el.value;if(!UI.newS.slugEdited){UI.newS.slug=slugify(el.value)};render()}
  else if(id==='ns-slug'){UI.newS.slug=el.value;UI.newS.slugEdited=true}
  else if(el.dataset&&el.dataset.av){setAvail(el.dataset.scope,[el.dataset.av],el.checked);render()}
  else if(el.dataset&&el.dataset.avday!=null){const d=+el.dataset.avday,ks=[];for(let p=0;p<NP();p++)if(valid(d,p))ks.push(key(d,p));setAvail(el.dataset.scope,ks,el.checked);render()}
  else if(el.dataset&&el.dataset.avcol!=null){const p=+el.dataset.avcol,ks=activeDays().filter(d=>valid(d,p)).map(d=>key(d,p));setAvail(el.dataset.scope,ks,el.checked);render()}
  else if(el.dataset&&el.dataset.ntc){const c=el.dataset.ntc;if(el.checked)UI.newT.cls[c]=SUB[UI.newT.s].h;else delete UI.newT.cls[c];render()}
  else if(el.dataset&&el.dataset.nth){const v=Math.max(1,Math.min(8,Math.round(+el.value)||1));UI.newT.cls[el.dataset.nth]=v;render()}
  else if(id==='nt-s'){UI.newT.s=el.value;for(const c in UI.newT.cls)UI.newT.cls[c]=SUB[el.value].h;render()}
  else if(id==='nt-pr'){UI.newT.present=el.checked}
  else if(id==='io-file'&&el.files&&el.files[0]){const f=el.files[0];readFileRows(f).then(sh=>{UI.imp=buildImport(sh);render()}).catch(err=>{UI.imp={error:err&&err.message==='noxlsx'?'تعذّر تحميل قارئ Excel. أعد فتح الصفحة، أو الصق البيانات مباشرة.':'تعذّرت قراءة الملف. تأكد أنه ملف Excel (.xlsx) أو CSV.'};render()})}
});
document.addEventListener('input',e=>{if(vieInput(e.target))return;if(e.target.id==='nt-n'){UI.newT.n=e.target.value;const was=UI._same,now=!!S.teachers.find(x=>x.n.trim()===e.target.value.trim());UI._same=now;if(was!==now){render();const i=$('#nt-n');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}if(e.target.id==='io-p1')UI.ioP1=e.target.value;if(e.target.id==='io-p2')UI.ioP2=e.target.value;if(e.target.id==='add-n')UI.add.n=e.target.value;if(e.target.id==='addc-n')UI.addC.n=e.target.value});

function onCell(d,p,gs){
  if(UI.ttMode!=='c')return;
  const {U}=unitsOf(),UM={},TM=tmap();for(const u of U)UM[u.id]=u;
  const ids=UI.sel?UI.sel.split(','):null;
  if(ids&&S.place[ids[0]]){
    const tg=targetsFor(ids,U)[key(d,p)],x=S.place[ids[0]];
    if(tg){const mv=ids.map((id,k)=>({id,d,p:p+k}));
      if(tg.startsWith('swap:'))mv.push(...tg.slice(5).split(',').map((id,k)=>({id,d:x.d,p:x.p+k})));
      const np=applyMoves(S.place,U,UM,mv,TM);if(np){commitPlace(np);done(tg==='move'?'نُقلت الحصة بدون تعارض':'بُدّلت الحصتان بدون تعارض');return}}
    if(gs===UI.sel){UI.sel=null;render();return}
  }
  if(gs){UI.sel=gs;render()}
  else if(ids)toast('هذه الخانة تسبب تعارضا، اختر خانة مظللة');
}
function approve(){
  const TM=tmap(),{U}=unitsOf(),UM={};for(const u of U)UM[u.id]=u;
  const aid=uid(),tid=UI.absT,d=UI.absD;
  S.absences.push({id:aid,tid,d,r:UI.absR});
  const L=k=>(S.ledger[k]??={sub:0,abs:0});
  for(const r of UI.absRows){
    const o=r.opts[r.choice];
    S.subs.push({abs:aid,d,p:r.p,len:r.u.len,cls:r.u.c,uid:r.u.id,ids:r.ids,type:o.type,sub:o.t||null,v:o.v||null,q:o.q??null});
    L(tid).abs+=r.u.len;if(o.t)L(o.t).sub+=r.u.len;
    note({cls:r.u.c,title:`${subLabel(o.type)} · ${SUB[r.u.s].sh} · ${DAYS[d]} ${tl(r.p)}`,text:o.type==='same'?`يعوّض ${TM[o.t].n} الحصة.`:o.type==='review'?`حصة مراجعة مع ${TM[o.t].n}.`:o.type==='swap'?`قُدّمت حصة ${SUB[UM[o.v].s].sh} إلى ${tl(r.p)}.`:'الحصة ملغاة.',darija:darijaFor(r,o,TM,UM)});
  }
  UI.absRows=null;save();render();toast('اعتُمد التعويض وأُشعر الأساتذة والأولياء');
}

if(S&&!S.eng2){S.eng2=true;
  const {U}=unitsOf(),byCS={};
  for(const [id,x] of Object.entries(S.place||{})){const [c,s,r]=id.split('_');if(!c||!s||!r)continue;const len=/^\d+$/.test(r)?2:1;for(let k=0;k<len;k++)(byCS[c+'|'+s]??=[]).push({d:x.d,p:x.p+k})}
  const np={};for(const u of U){const L=byCS[u.c+'|'+u.s];if(L&&L.length){L.sort((a,b)=>a.d-b.d||a.p-b.p);np[u.id]=L.shift()}}
  S.place=np;S.split=[];S.subs=[];S.absences=[];S.ledger={};save()}
if(!S){const id='s'+uid();ROOT.schools.push({id,name:'مدرسة تجريبية',slug:'demo',color:'#1D5A48',logo:null,created:Date.now()});ROOT.cur=id;S=seed();S.eng2=true;ROOT.data[id]=S;generate()}else if(needGen)generate();
else{const {U}=unitsOf(),hh={};let bad=0;
  for(const u of U){const x=S.place[u.id];if(!x||NOCAP.includes(u.s))continue;const k=u.c+'|'+u.s+'|'+x.d;(hh[k]??=[]).push(u)}
  for(const k in hh){let h=0;for(const u of hh[k].sort((a,b)=>b.len-a.len)){h+=u.len;if(h>2){delete S.place[u.id];bad++}}}
  if(bad){const r=improve(2000);S.place=r.pl;save()}}
applyBrand();render();
</script>
